services:
  - type: web
    name: iran-osint-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: iran-osint-db
          property: connectionString
      - key: ADMIN_IDS
        sync: false
databases:
  - name: iran-osint-db
    plan: basic-256mb
